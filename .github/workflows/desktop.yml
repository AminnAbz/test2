name: Web Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: Install desktop environment
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies tightvncserver wget curl git

      - name: Setup VNC password
        run: |
          mkdir -p ~/.vnc
          echo "12345678" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

      - name: Start VNC server
        run: |
          vncserver :1 -geometry 1280x800 -depth 24
          export DISPLAY=:1
          startxfce4 &

      - name: Install noVNC
        run: |
          git clone https://github.com/novnc/noVNC.git
          git clone https://github.com/novnc/websockify noVNC/utils/websockify

      - name: Start noVNC
        run: |
          ./noVNC/utils/novnc_proxy --vnc localhost:5901 &
          sleep 5

      - name: Install Cloudflare Tunnel
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared

      - name: Start tunnel
        run: |
          cloudflared tunnel --url http://localhost:6080 &
          sleep 20
          echo "Tunnel started. Look above for the trycloudflare.com link."
          sleep 20000
